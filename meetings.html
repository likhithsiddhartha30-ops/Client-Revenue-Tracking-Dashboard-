<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meetings · WorthyOps Revenue Tracking</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
  <script src="assets/js/config.js"></script>
</head>
<body>
  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content" id="content">

        <section class="grid kpi-grid" id="kpis"></section>

        <section class="grid g-2-1">
          <div class="card">
            <div class="card-head">
              <div><h3>Booked vs. Showed Up</h3><p>Monthly meetings with show-up rate</p></div>
              <div class="legend"><span><i style="background:#2a3550"></i>Booked</span><span><i style="background:#4f8cff"></i>Showed</span><span><i class="line" style="background:#dbe5ff"></i>Show rate</span></div>
            </div>
            <div class="chart h-300"><canvas id="meetChart"></canvas></div>
          </div>
          <div class="card">
            <div class="card-head"><div><h3>Attendance</h3><p>Showed up vs. no-shows</p></div></div>
            <div class="donut-wrap"><canvas id="attChart"></canvas><div class="donut-center"><div><b id="showRate">—</b><span>show-up rate</span></div></div></div>
            <div class="donut-legend" id="attLegend"></div>
          </div>
        </section>

        <section class="card">
          <div class="card-head">
            <div><h3>Meetings by Client</h3><p>Booked and attended calls per client</p></div>
            <div class="legend"><span><i style="background:#2a3550"></i>Booked</span><span><i style="background:#8fb4ff"></i>Showed</span></div>
          </div>
          <div class="chart h-260"><canvas id="clientChart"></canvas></div>
        </section>

        <section class="card">
          <div class="card-head"><div><h3>Monthly Breakdown</h3><p>Meetings booked, attended and missed</p></div></div>
          <div id="table"></div>
        </section>

      </main>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/seed.js"></script>
  <script src="assets/js/backend.js"></script>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/pages/meetings.js"></script>
</body>
</html>
